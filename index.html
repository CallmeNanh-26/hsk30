<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đối chiếu HSK 3.0</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Tự đánh dấu từ vựng đã học, đối chiếu với HSK 3.0 cấp 1-6, ôn flashcard và làm bài tập.">
<meta name="theme-color" content="#5b6b3a">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><span class="logo">汉</span> Đối chiếu HSK 3.0</h1>
  <div class="sub" id="subline">Đang tải dữ liệu…</div>
</header>

<nav class="tabs" id="tabs">
  <button data-view="search" class="active"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="f2" d="M17 27.5 20.4 13.5H31l-3.4 14z"/><path d="M10.5 27.5H30"/><path class="f1" d="M3.5 27.5q-.4-5.2 3.6-6.6"/><path class="f1" d="M3.4 8.6 3.9 3.4l3.9 3.2M13 6.6l3.9-3.2.5 5.2"/><ellipse class="f1" cx="10.4" cy="13.4" rx="7.6" ry="6.8"/><path d="M6.4 12.4q1.1-1.2 2.2 0M12.2 12.4q1.1-1.2 2.2 0"/><path class="fs" d="M9.2 15.2q1.2 1.9 2.4 0z"/><circle class="dot" cx="5.2" cy="16" r=".75"/><circle class="dot" cx="15.4" cy="9.6" r=".75"/><circle class="dot" cx="15.6" cy="16.2" r=".65"/><path class="f1" d="M12.6 27.4q-.2-2.6 2.4-2.6t2.4 2.6M17.4 27.4q-.2-2.6 2.4-2.6t2.4 2.6"/></svg></span>Tra từ</button>
  <button data-view="chuyende"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="f2" d="M7 6.5h18v19H7z"/><rect class="f1" x="4.5" y="4" width="23" height="3.4" rx="1.7"/><rect class="f1" x="4.5" y="24.6" width="23" height="3.4" rx="1.7"/><path d="M11 11v10M14.5 11v10M18 11v6"/><rect class="fs" x="20" y="17.6" width="3.6" height="3.6" rx=".6"/></svg></span>Chuyên đề</button>
  <button data-view="progress"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="f1" d="M3 29v-4h5v4M8 29v-7.5h5V29M13 29V18h5v11M18 29V14h5v15M23 29V9.5h5V29"/><path d="M2 29h28"/><path d="M25.5 9.5V3.2"/><path class="fs" d="M25.5 3.2l4.6 1.6-4.6 1.6z"/><path class="dash" d="M4.5 21.5Q12 9 22 6"/><circle class="f2" cx="10.5" cy="13.2" r="2.2"/><path d="M10.5 15.4v3.4M10.5 16.6l-2 1.3M10.5 16.6l2.2-1.6M10.5 18.8l-1.4 2.7M10.5 18.8l1.6 2.6"/></svg></span>Tiến độ</button>
  <button data-view="review"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="fi" d="M2.6 4.2l5.4-1.2 1.4 6.4-5.4 1.2z"/><path d="M4.4 6.2l2.4-.5M4.8 8.2l2.4-.5"/><path class="f2" d="M23.2 2.4l6 .8-.9 6.4-6-.8z"/><path d="M24.6 5l2.6.4M24.3 7.1l1.8.3"/><circle class="f2" cx="16" cy="15.6" r="7.6"/><path d="M11.8 14.4l2.3 1M20.2 14.4l-2.3 1M14.4 18.6q.8-.7 1.6 0t1.6 0"/><circle class="blush" cx="11.6" cy="17.4" r="1.1"/><circle class="blush" cx="20.4" cy="17.4" r="1.1"/><path class="f1" d="M5 25.2q5.5-2.4 11 0 5.5-2.4 11 0v2.6q-5.5-2.4-11 0-5.5-2.4-11 0z"/><path d="M16 25.2v2.6M2 28.6h28"/></svg></span>Ôn tập</button>
  <button data-view="mine"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="f2" d="M6.6 28.4q-1.4-8.4 5.8-10.4 7.2 2 5.8 10.4z"/><circle class="f2" cx="12.4" cy="11" r="6.8"/><circle class="dot" cx="10" cy="10.6" r=".95"/><circle class="dot" cx="14.8" cy="10.6" r=".95"/><path d="M10.8 13.4q1.6 1.4 3.2 0"/><path class="fi" d="M14.4 16.4h13v3.4h-13z"/><path class="f1" d="M15.4 19.8h12.4v3.4H15.4z"/><path class="fs" d="M14 23.2h13v3.2H14z"/><ellipse class="f2" cx="14.4" cy="21.4" rx="1.5" ry="2"/><path d="M9.6 28.4v.8M15 28.4v.8"/></svg></span>Từ của tôi</button>
  <button data-view="duyet" id="tabDuyet" style="display:none"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><path class="f2" d="M6 4.5h15l5 5V28H6z"/><path d="M10 10h8M10 14h11M10 18h6"/><rect class="fs" x="17.5" y="19.5" width="9" height="9" rx="1.6" transform="rotate(-8 22 24)"/><path class="paper" d="M19.8 24.2l1.7 1.6 3-3.4"/></svg></span>Duyệt từ</button>
  <button data-view="more"><span class="ic" aria-hidden="true"><svg viewBox="0 0 32 32"><circle class="teeth" cx="16" cy="18" r="10"/><circle class="f2" cx="16" cy="18" r="8"/><circle class="dot" cx="13.2" cy="17" r="1"/><circle class="dot" cx="18.8" cy="17" r="1"/><path d="M14.4 20.2q1.6 1.4 3.2 0"/><circle class="blush" cx="11.3" cy="19.8" r="1.2"/><circle class="blush" cx="20.7" cy="19.8" r="1.2"/><path d="M16 8V4.6"/><path class="leaf" d="M16 5.6q-4-3.4-6.2-.6 3.2 2.6 6.2.6zM16 4.8q3.2-3.6 6.4-1.4-2.8 3.2-6.4 1.4z"/></svg></span>Cài đặt</button>
</nav>

<main>
  <div id="remind"></div>
  <!-- TRA TU -->
  <section class="view active" id="view-search">
    <div class="search">
      <input id="q" type="search" placeholder="Tìm chữ Hán, pinyin (vd: gongchang) hoặc nghĩa tiếng Việt" autocomplete="off">
      <button class="clear" id="qclear" aria-label="Xóa">×</button>
    </div>
    <div class="chips" id="lvChips"></div>
    <div class="chips" id="tagChips"></div>
    <div class="chips" id="stChips"></div>
    <div class="toolbar">
      <span class="muted small" id="count"></span>
      <span class="row">
        <button class="btn" id="markAll">✓ Đánh dấu tất cả</button>
        <button class="btn ghost" id="unmarkAll">Bỏ đánh dấu</button>
      </span>
    </div>
    <div class="list" id="results"></div>
    <div class="more" id="moreWrap"><button class="btn" id="moreBtn">Xem thêm</button></div>
  </section>

  <!-- TIEN DO -->
  <section class="view" id="view-progress"></section>

  <!-- ON TAP -->
  <section class="view" id="view-review"></section>

  <!-- TU CUA TOI -->
  <!-- KHOA CHUYEN DE -->
  <section class="view" id="view-chuyende"></section>

  <section class="view" id="view-mine"></section>

  <!-- DUYET TU (giao vien) -->
  <section class="view" id="view-duyet"></section>

  <!-- CAI DAT -->
  <section class="view" id="view-more"></section>
</main>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data/danh-sach.js"></script>
<script>
  // Tai song song cac file du lieu nhung chay dung thu tu (async=false); file nao thieu thi bo qua
  (window.HSK_FILES || []).concat(['app.js', 'app-tu.js', 'app-nhac.js', 'app-ai.js', 'app-chuyende.js', 'app-hoc.js']).forEach(function (f) {
    var el = document.createElement('script');
    el.src = f + '?v=' + (window.HSK_VERSION || '1');
    el.async = false;
    document.body.appendChild(el);
  });
</script>
</body>
</html>
